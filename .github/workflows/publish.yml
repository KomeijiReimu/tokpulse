name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (leave unchecked to preview only)
        type: boolean
        default: false

permissions: {}

jobs:
  verify:
    name: Verify and pack
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun x --no-install tsc --noEmit

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun test

      - name: Build and verify committed dist
        run: |
          bun run build
          git diff --exit-code -- dist

      - name: Pack and verify package entry points
        run: |
          bun pm pack --filename "$RUNNER_TEMP/tokpulse.tgz"
          tar -tzf "$RUNNER_TEMP/tokpulse.tgz" \
            package/package.json package/dist/server.js package/dist/tui.js package/bin/tokpulse.mjs

      - name: Smoke test installed package
        run: |
          consumer=$(mktemp -d "$RUNNER_TEMP/tokpulse-smoke.XXXXXXXX")
          cd "$consumer"
          printf '%s\n' '{"private":true}' > package.json
          bun add "$RUNNER_TEMP/tokpulse.tgz"
          bun --eval '
            import assert from "node:assert/strict";
            import server from "@komeijireimu/tokpulse";
            import tui from "@komeijireimu/tokpulse/tui";
            assert.equal(typeof server?.setup, "function", "Missing server setup export");
            assert.equal(typeof tui?.setup, "function", "Missing TUI setup export");
          '
          bun x --no-install tokpulse --help

      - name: Upload package tarball
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokpulse.tgz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified package
    needs: verify
    if: github.ref == 'refs/heads/master' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
          no-cache: true

      - name: Download verified package tarball
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}

      - name: Publish with npm Trusted Publishing
        run: >-
          bun x --package=npm@11.21.3 npm publish "$RUNNER_TEMP/tokpulse.tgz"
          --access public --registry=https://registry.npmjs.org
